<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Cube World!</title>
    <style>
      button {
        width: 200px;
        font-size: 15px;
        margin: 8px;
        padding: 3px;
      }

      main {
        margin: 2px;
      }
    </style>
  </head>
  <body>
    <div align="center">
      <h2>Its Cube Time</h2>
      <img
        id="gambar"
        src="https://assets.cdn.dicoding.com/original/commons/homepage-dicoding-challenge-illustration.png"
        alt="Its a rubiks cube!"
        width="300"
        height="215"
      />
      <p id="caption">
        Sudah siap untuk memecahkan teka-teki permainan tersebut?
      </p>
      <div class="button-group">
        <div class="button"><button>Sejarah</button></div>
        <div class="button"><button>Permainan</button></div>
        <div class="button">
          <button><i>Fun Fact</i></button>
        </div>
        <div class="button">
          <button disabled="disabled">Play (Coming Soon)</button>
        </div>
        <div class="button"><button>Exit</button></div>
      </div>
    </div>

    <hr size="2" width="95%" color="black" />
    <div id="links">
      <p>Situs lainnya tidak kalah menarik:</p>
      <ul>
        <li>
          <a href="http://www.dicoding.com" id="dicodingLink">Dicoding</a>
        </li>
        <li><a href="http://www.google.com" id="googleLink">Google</a></li>
      </ul>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
